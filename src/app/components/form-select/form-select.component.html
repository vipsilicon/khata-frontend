<div class="px-5 py-2 space-y-2">
  @if (label) {
    <label class="block mb-2 font-medium text-gray-700">{{ label }}</label>
  }

  <select
    [formControl]="control"
    class="w-full rounded-lg border border-gray-300 px-4 py-2 outline-none focus:ring-2 focus:ring-cyan-500"
  >
    @if (placeholder) {
      <option [ngValue]="emptyValue">{{ placeholder }}</option>
    }

    @for (opt of options; track trackOption(opt)) {
      <option [ngValue]="opt.value">{{ opt.label }}</option>
    }
  </select>

  <div class="min-h-6">
    @if (control.touched) {
      @for (err of errorEntries; track err.key) {
        @if (control.hasError(err.key)) {
          <p class="text-sm text-red-500">{{ err.message }}</p>
        }
      }
    }
    @if (extraError) {
      <p class="text-sm text-red-500">{{ extraError }}</p>
    }
  </div>
</div>
