<div class="p-6">
  <div class="flex justify-between items-center mb-5">
    <div>
      <h2 class="text-2xl font-bold text-gray-700">Payee</h2>
      <p class="text-gray-500 text-sm">Manage payee passbook and analysis</p>
    </div>
  </div>

  <div class="flex gap-2 overflow-x-auto pb-2 mb-4" style="scrollbar-width: thin">
    <button
      type="button"
      (click)="selectTab('passbook')"
      class="shrink-0 px-4 py-2 rounded-t-lg border-b-2 text-sm font-semibold transition cursor-pointer"
      [ngClass]="
        selectedTab() === 'passbook'
          ? 'border-cyan-700 text-cyan-800 bg-white'
          : 'border-transparent text-gray-500 hover:text-cyan-700 hover:bg-white/60'
      "
    >
      Passbook
    </button>
    <button
      type="button"
      (click)="selectTab('analysis')"
      class="shrink-0 px-4 py-2 rounded-t-lg border-b-2 text-sm font-semibold transition cursor-pointer"
      [ngClass]="
        selectedTab() === 'analysis'
          ? 'border-cyan-700 text-cyan-800 bg-white'
          : 'border-transparent text-gray-500 hover:text-cyan-700 hover:bg-white/60'
      "
    >
      Analysis
    </button>
  </div>

  @if (selectedTab() === 'passbook') {
    <app-payee-passbook />
  } @else if (selectedTab() === 'analysis') {
    <app-payee-analysis />
  }
</div>
