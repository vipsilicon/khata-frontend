<div class="p-6">
  <h2 class="text-2xl font-bold text-gray-700">Product</h2>
  <p class="text-gray-500 text-sm mt-1">Manage products</p>
</div>

<div class="flex gap-2 overflow-x-auto pb-2 mb-4 p-6" style="scrollbar-width: thin">
  @for (item of items(); track item.id) {
    <button
      type="button"
      (click)="selectProductTab(item)"
      class="shrink-0 px-4 py-2 rounded-t-lg border-b-2 text-sm font-semibold transition cursor-pointer"
      [ngClass]="
        selectedTab() === item.id
          ? 'border-cyan-700 text-cyan-800 bg-white'
          : 'border-transparent text-gray-500 hover:text-cyan-700 hover:bg-white/60'
      "
    >
      {{ item.name }}
    </button>
  }
</div>
